<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E19C"/>
      <stop offset="50%" stop-color="#DFB251"/>
      <stop offset="100%" stop-color="#A47926"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>

  <!-- Inner shield -->
  <path d="M100 40 L145 58 V100 C145 132 126 158 100 168 C74 158 55 132 55 100 V58 Z"
        fill="url(#blueGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Book / open book -->
  <path d="M100 78 C88 70 72 70 62 76 V118 C72 112 88 112 100 120 C112 112 128 112 138 118 V76 C128 70 112 70 100 78 Z"
        fill="url(#goldGrad)" fill-opacity="0.95"/>
  <line x1="100" y1="78" x2="100" y2="120" stroke="#0B132B" stroke-width="1.5" opacity="0.5"/>

  <!-- Torch / flame -->
  <path d="M100 92 C100 92 92 100 92 107 C92 111 96 114 100 114 C104 114 108 111 108 107 C108 100 100 92 100 92 Z"
        fill="url(#goldGrad)"/>
  <path d="M100 96 C97 100 96 103 96 106 C96 108 98 110 100 110 C102 110 104 108 104 106 C104 103 103 100 100 96 Z"
        fill="#FFF7E0"/>

  <!-- Star -->
  <path d="M100 148 L103 141 L110 141 L104.5 136.5 L106.5 130 L100 134 L93.5 130 L95.5 136.5 L90 141 L97 141 Z"
        fill="url(#goldGrad)"/>

  <!-- Text arc on outer ring -->
  <text font-family="Arial, sans-serif" font-size="11" fill="url(#goldGrad)" font-weight="bold" letter-spacing="2">
    <textPath href="#ringPath">SMAN 1 PRAMBON</textPath>
  </text>
  <path id="ringPath" d="M100 100 m-78 0 a78 78 0 1 1 156 0 a78 78 0 1 1 -156 0" fill="none"/>
</svg>